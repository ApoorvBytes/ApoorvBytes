<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="about-life.svg">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1b"/><stop offset=".58" stop-color="#0b1428"/><stop offset="1" stop-color="#170d20"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#247bff"/><stop offset=".52" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39b6ff"/><stop offset="1" stop-color="#247bff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#45618c" opacity=".35"/></pattern>
 <clipPath id="portrait"><rect x="0" y="0" width="260" height="260" rx="22"/></clipPath>
</defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#f3f6ff} .muted{fill:#aab7d1} .small{font-size:15px} .label{font-size:13px;letter-spacing:2px;fill:#7e9ac7} .head{font-size:29px;font-weight:800} .card{fill:#0d172b;stroke:#253957;stroke-width:1.4} .blue{fill:#48baff} .red{fill:#ff5572} .stroke{stroke:url(#line);stroke-width:2;fill:none} </style>
<rect width="100%" height="100%" rx="24" fill="url(#bg)"/><rect width="100%" height="100%" rx="24" fill="url(#dots)"/><path d="M0 3H1000" stroke="url(#line)" stroke-width="4"/><text x="42" y="58" class="label">01 / THE PERSON BEHIND THE CODE</text><text x="42" y="105" class="head">About Me</text><text x="42" y="148" font-size="19" class="muted">I’m an engineering student and developer who enjoys turning ideas</text><text x="42" y="177" font-size="19" class="muted">into useful, well-crafted software. I work across frontend, backend</text><text x="42" y="206" font-size="19" class="muted">and data-oriented projects, with a focus on shipping real solutions.</text><g transform="translate(42 236)"><rect width="185" height="42" rx="12" class="card"/><text x="18" y="27" class="blue" font-size="15">01</text><text x="54" y="27" font-size="15">Build with intent</text><rect x="198" width="185" height="42" rx="12" class="card"/><text x="216" y="27" class="blue" font-size="15">02</text><text x="252" y="27" font-size="15">Learn continuously</text><rect x="396" width="185" height="42" rx="12" class="card"/><text x="414" y="27" class="red" font-size="15">03</text><text x="450" y="27" font-size="15">Solve real problems</text></g><text x="680" y="83" class="label">BEYOND THE SCREEN</text><rect x="680" y="104" width="270" height="174" rx="18" class="card"/><text x="706" y="148" font-size="24" class="blue">Curiosity</text><text x="706" y="181" class="muted" font-size="16">Exploring new tools,</text><text x="706" y="206" class="muted" font-size="16">ideas and ways to make</text><text x="706" y="231" class="muted" font-size="16">technology more useful.</text></svg>